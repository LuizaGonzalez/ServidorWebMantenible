<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ServidorWebMantenible</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <h1>Servidor Web Mantenible</h1>

    <img src="/images/logo.png" alt="Logo" width="150">

    <div class="service-box">
        <label for="name">Tu nombre:</label>
        <input type="text" id="name" placeholder="Escribe tu nombre">
        <button onclick="greet()">Saludar</button>
        <p id="result" class="result"></p>
    </div>
    
    <div class="service-box">
        <button onclick="getPi()">Calcular π</button>
        <p id="resultPi" class="result"></p>
    </div>
    
    <div class="service-box">
        <button onclick="getE()">Calcular e</button>
        <p id="resultE" class="result"></p>
    </div>
    
    <div class="service-box">
        <label for="value">Número:</label>
        <input type="number" id="value" placeholder="Escribe un número">
        <button onclick="getSquare()">Calcular</button>
        <p id="resultSquare" class="result"></p>
    </div>


    <script src="/app.js"></script>
</body>
</html>
